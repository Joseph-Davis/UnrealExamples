; Localization pipeline for the plugin's own text (menu labels, settings, dialogs).
; Run with: UnrealEditor-Cmd.exe <Project>.uproject -run=GatherText -config="<this file>" -unattended
; Translations live in Content/Localization/AssetproLobbyKit/<culture>/AssetproLobbyKit.po

[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/AssetproLobbyKit/Content/Localization/AssetproLobbyKit
DestinationPath=%LOCPROJECTROOT%Plugins/AssetproLobbyKit/Content/Localization/AssetproLobbyKit
ManifestName=AssetproLobbyKit.manifest
ArchiveName=AssetproLobbyKit.archive
PortableObjectName=AssetproLobbyKit.po
ResourceName=AssetproLobbyKit.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=es
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=pl
CulturesToGenerate=pt-BR
CulturesToGenerate=ru
CulturesToGenerate=zh-Hans

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Plugins/AssetproLobbyKit/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
